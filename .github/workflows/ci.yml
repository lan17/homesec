name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: homesec
          POSTGRES_USER: homesec
          POSTGRES_PASSWORD: homesec
        ports:
          - "5432:5432"
        # No health check - Postgres boots while lint/typecheck run

    env:
      DB_DSN: postgresql+asyncpg://homesec:homesec@localhost:5432/homesec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/webrtc/target
            /tmp/homesec-native-*
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'native/webrtc/Cargo.toml', 'native/webrtc/Cargo.lock', 'native/webrtc/build_native.py') }}

      - name: Rust check
        # The shared recipe builds static FFmpeg/OpenCV; media tests also use the CLI.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 cmake ffmpeg clang libclang-dev pkg-config nasm
          make rust-check

      - name: Build WebRTC helper
        run: |
          make rust-build
          dependencies="$(ldd native/webrtc/target/release/homesec-webrtc)"
          if printf '%s\n' "$dependencies" | grep -E 'lib(opencv_[^[:space:]]*|avcodec|avformat|avfilter|avutil|avdevice|swscale|swresample)\.so'; then
            echo "The native helper must use bundled static FFmpeg and OpenCV libraries." >&2
            exit 1
          fi
          echo "$GITHUB_WORKSPACE/native/webrtc/target/release" >> "$GITHUB_PATH"

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('uv.lock') }}

      - name: Check uv lockfile
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --group dev --locked

      # Lint and typecheck run while Postgres boots
      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      # Wait for Postgres before migrations
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U homesec && break
            echo "Waiting for Postgres..."
            sleep 1
          done

      - name: Run migrations
        run: uv run --locked alembic -c alembic.ini upgrade head

      - name: Test with coverage
        run: make coverage

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: UI check
        run: pnpm --dir ui check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
