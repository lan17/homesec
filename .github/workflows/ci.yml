name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # api_codegen.mjs invokes uv itself; keep that nested command locked too.
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash

jobs:
  rust-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust formatting
        run: |
          rustup show active-toolchain
          rustup component add rustfmt
          cargo fmt --manifest-path native/webrtc/Cargo.toml --all -- --check

  python-static:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - name: Python static checks
        env:
          CHECK: ${{ matrix.check }}
        run: make "$CHECK"
      - name: Check CI support code
        if: matrix.check == 'lint'
        run: |
          uv run --locked ruff check .github/scripts
          uv run --locked ruff format --check .github/scripts
          uv run --locked python .github/scripts/test_ci.py
      - name: Type check CI support code
        if: matrix.check == 'typecheck'
        run: uv run --locked mypy .github/scripts/test_ci.py --strict

  ui:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: ['api:check', lint, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile
      # Only the contract exporter needs Python; no running app or Postgres.
      - uses: ./.github/actions/setup-python
        if: matrix.check == 'api:check'
      - name: Install contract import prerequisites
        if: matrix.check == 'api:check'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1
      - name: UI check
        env:
          CHECK: ${{ matrix.check }}
        run: pnpm --dir ui "$CHECK"

  native-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
        id: native
      - name: Prepare native libraries
        id: prepare
        # The existing wrapper validates/builds every native dependency before
        # executing this cheap Cargo command. Do not skip it on a cache hit.
        run: python3 native/webrtc/build_native.py -- cargo --version
      - name: Save completed native libraries
        if: steps.prepare.outcome == 'success' && steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native.outputs.cache-path }}
          key: ${{ steps.native.outputs.cache-key }}

  rust-tests:
    needs: native-deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
        id: native
      - name: Cache Rust check outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/webrtc/target
          key: cargo-check-${{ steps.native.outputs.cache-key }}-${{ hashFiles('native/webrtc/src/**', 'native/webrtc/tests/**', 'native/webrtc/build.rs', 'native/webrtc/vendor/**') }}
          restore-keys: |
            cargo-check-${{ steps.native.outputs.cache-key }}-
      - name: Clippy
        run: python3 native/webrtc/build_native.py -- cargo clippy --manifest-path native/webrtc/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust tests
        run: python3 native/webrtc/build_native.py -- cargo test --manifest-path native/webrtc/Cargo.toml --locked

  native-build:
    needs: native-deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
        id: native
      - name: Cache Rust release outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/webrtc/target
          key: cargo-release-${{ steps.native.outputs.cache-key }}-${{ hashFiles('native/webrtc/src/**', 'native/webrtc/tests/**', 'native/webrtc/build.rs', 'native/webrtc/vendor/**') }}
          restore-keys: |
            cargo-release-${{ steps.native.outputs.cache-key }}-
      - name: Build WebRTC helper
        run: |
          make rust-build
          dependencies="$(ldd native/webrtc/target/release/homesec-webrtc)"
          if printf '%s\n' "$dependencies" | grep -E 'lib(opencv_[^[:space:]]*|avcodec|avformat|avfilter|avutil|avdevice|swscale|swresample|x264|opus)\.so'; then
            echo "The native helper must use bundled static FFmpeg, OpenCV, x264 and Opus libraries." >&2
            exit 1
          fi
      - name: Publish helper for this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: homesec-webrtc-${{ github.sha }}
          path: native/webrtc/target/release/homesec-webrtc
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  python-tests:
    # Keep the complete suite's existing helper environment. Splitting tests
    # by helper dependency needs a separate inventory/coverage change.
    needs: native-build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: homesec
          POSTGRES_USER: homesec
          POSTGRES_PASSWORD: homesec
        ports:
          - "5432:5432"
    env:
      DB_DSN: postgresql+asyncpg://homesec:homesec@localhost:5432/homesec
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 postgresql-client
      - name: Download this run's helper
        uses: actions/download-artifact@v4
        with:
          name: homesec-webrtc-${{ github.sha }}
          path: native/webrtc/target/release
      - name: Make helper executable and available
        run: |
          chmod +x native/webrtc/target/release/homesec-webrtc
          echo "$GITHUB_WORKSPACE/native/webrtc/target/release" >> "$GITHUB_PATH"
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U homesec; then
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1
      - name: Run migrations
        run: uv run --locked alembic -c alembic.ini upgrade head
      - name: Test with coverage
        run: make coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  ci:
    # Retain the original required check name; skipped prerequisites must fail.
    if: always()
    needs: [rust-format, python-static, ui, native-deps, rust-tests, native-build, python-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$JOB_RESULTS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$JOB_RESULTS"
