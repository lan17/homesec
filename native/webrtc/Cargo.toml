[package]
name = "homesec-webrtc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
mio = { version = "1", features = ["net", "os-poll"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }

[dev-dependencies]
tempfile = "3"
